[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-checker"
version = "1.0.0"
description = "Domain monitoring service for traffic arbitrage"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Domain Checker Contributors"}
]
dependencies = [
    "httpx>=0.27.0",
    "aiogram>=3.4.0",
    "apscheduler>=3.10.4",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.20.2",
]

[project.scripts]
domain-checker = "domain_checker.main:main"

[tool.setuptools]
packages = ["domain_checker", "domain_checker.sources"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
